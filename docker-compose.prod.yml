services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: ictaubate_app
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: ictaubate_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ictaubate
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ictaubate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ictaubate"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
