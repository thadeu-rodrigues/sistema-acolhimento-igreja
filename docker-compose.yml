services:
  postgres:
    image: postgres:16-alpine
    container_name: ictaubate_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ictaubate
      POSTGRES_PASSWORD: ictaubate_dev
      POSTGRES_DB: ictaubate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ictaubate"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
